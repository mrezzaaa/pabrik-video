services:
  postgres:
    image: postgres:16-alpine
    container_name: pabrik-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: pabrik
      POSTGRES_PASSWORD: pabrik_secret
      POSTGRES_DB: pabrik_video
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5433:5432"
    networks:
      - pabrik-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pabrik -d pabrik_video"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: pabrik-redis
    restart: unless-stopped
    ports:
      - "6380:6379"
    volumes:
      - redis_data:/data
    networks:
      - pabrik-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  searxng:
    image: searxng/searxng:latest
    container_name: pabrik-searxng
    restart: unless-stopped
    ports:
      - "8080:8080"
    volumes:
      - ./searxng/settings.yml:/etc/searxng/settings.yml:ro
    environment:
      - SEARXNG_BASE_URL=http://searxng:8080
    networks:
      - pabrik-network

  web-app:
    build:
      context: .
      dockerfile: Dockerfile.web
    container_name: pabrik-web-app
    restart: unless-stopped
    ports:
      - "4000:4000"
    environment:
      - NODE_ENV=production
      - DATABASE_URL=postgresql://pabrik:pabrik_secret@postgres:5432/pabrik_video?schema=public
      - REDIS_URL=redis://redis:6379
      - OMNIROUTE_BASE_URL=http://host.docker.internal:20128/v1
      - OMNIROUTE_API_KEY=sk-omniroute-pabrik-local
      - SEARXNG_URL=http://searxng:8080
    volumes:
      - assets_data:/app/public/assets
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      searxng:
        condition: service_started
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - pabrik-network

  worker-engine:
    build:
      context: .
      dockerfile: Dockerfile.worker
    container_name: pabrik-worker-engine
    restart: unless-stopped
    environment:
      - NODE_ENV=production
      - DATABASE_URL=postgresql://pabrik:pabrik_secret@postgres:5432/pabrik_video?schema=public
      - REDIS_URL=redis://redis:6379
      - OMNIROUTE_BASE_URL=http://host.docker.internal:20128/v1
      - OMNIROUTE_API_KEY=sk-omniroute-pabrik-local
      - SEARXNG_URL=http://searxng:8080
      - VOICE_DEFAULT_ID=aad77d68
      - VOICESTUDIO_BASE_URL=http://host.docker.internal:3900/v1
      - VOICESTUDIO_VOICE_NAME=reza
      - REMOTION_CONCURRENCY=2
      - REMOTION_FPS=30
      - PIPELINE_STYLE=tech
      - AUTO_ASSEMBLY=1
      - REMOTION_GL=swangle
    volumes:
      - assets_data:/app/public/assets
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      searxng:
        condition: service_started
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - pabrik-network

volumes:
  postgres_data:
  redis_data:
  assets_data:

networks:
  pabrik-network:
    driver: bridge
