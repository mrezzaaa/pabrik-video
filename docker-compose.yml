services:
  searxng:
    image: searxng/searxng:latest
    container_name: pabrik-searxng
    ports:
      - "8080:8080"
    volumes:
      - ./searxng:/etc/searxng:rw
    environment:
      - SEARXNG_BASE_URL=http://localhost:8080/
      - UWSGI_WORKERS=2
      - UWSGI_THREADS=2
    restart: unless-stopped

  piper:
    image: rhasspy/wyoming-piper:latest
    container_name: pabrik-piper
    ports:
      - "10200:10200"
    volumes:
      - piper-data:/data
    command: ["--voice", "id_ID-news_tts-medium"]
    restart: unless-stopped

volumes:
  piper-data:
