# SearXNG configuration for Pabrik Video research agent.
# The JSON output format is required by src/lib/searxng.ts.
use_default_settings: true

server:
  secret_key: "pabrik-video-searxng-secret-change-me"
  bind_address: "0.0.0.0"
  port: 8080
  base_url: false
  image_proxy: true

search:
  safe_search: 0
  autocomplete: ""
  default_lang: "id-ID"
  formats:
    - html
    - json

# Public default engines get suspended constantly (Google CSE / Brave rate
# limits, DuckDuckGo TLS failures). Bing and Yahoo ship disabled in the
# default settings, so enable them explicitly as the primary working pair.
# The app also passes ?engines=... and falls back group by group.
engines:
  - name: bing
    disabled: false
  - name: yahoo
    disabled: false

categories_as_tabs:
  general:
    - bing
    - yahoo
  images:
    - bing images
    - unsplash
